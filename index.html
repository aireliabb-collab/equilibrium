<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equilibrium - 去噪生理學與訓練系統</title>
  
  <!-- CDN Imports -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background-color: #09090b; color: #f4f4f5; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen font-sans antialiased pb-20">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // 訓練部位與動作選單資料庫
    const WORKOUT_EXERCISES = {
      '胸部 (Chest)': ['槓鈴臥推', '上斜啞鈴推舉', '雙槓體撐', '繩索飛鳥', '夾胸機'],
      '背部 (Back)': ['硬舉', '滑輪下拉', '槓鈴划船', '單臂啞鈴划船', '坐姿繩索划船'],
      '肩部 (Shoulders)': ['站姿槓鈴肩推', '啞鈴側平舉', '繩索面拉', '後三角飛鳥'],
      '腿部 (Legs)': ['深蹲', '羅馬尼亞硬舉 (RDL)', 'Leg Press 腿推', '腿彎舉', '腿伸展'],
      '手臂 (Arms)': ['槓鈴彎舉', '三頭肌繩索壓下', '啞鈴錘式彎舉', '仰臥三頭伸展'],
      '核心 (Core)': ['懸垂舉腿', '輪胎/滾輪滾輪', '負重板撐']
    };

    const TAG_CATALOGUE = [
      { id: 'DOMS_INFLAMMATION', label: '大重量發炎 (DOMS)', badge: 'bg-rose-950/80 text-rose-300 border-rose-800' },
      { id: 'HIGH_SODIUM_MEAL', label: '高鈉外食/火鍋', badge: 'bg-amber-950/80 text-amber-300 border-amber-800' },
      { id: 'REFEED', label: '週期性補碳日', badge: 'bg-sky-950/80 text-sky-300 border-sky-800' },
      { id: 'LACK_OF_SLEEP', label: '睡眠不足 (<6h)', badge: 'bg-purple-950/80 text-purple-300 border-purple-800' },
      { id: 'HIGH_STRESS', label: '高皮質醇/壓力', badge: 'bg-indigo-950/80 text-indigo-300 border-indigo-800' }
    ];

    function calculateRollingAverages(records, days) {
      const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
      return sorted.map((current, idx) => {
        const startIdx = Math.max(0, idx - days + 1);
        const slice = sorted.slice(startIdx, idx + 1);
        const sum = slice.reduce((acc, curr) => acc + (curr.weightKg || 0), 0);
        return { date: current.date, avg: Number((sum / slice.length).toFixed(2)) };
      });
    }

    function AnalyticsChart({ data }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || data.length === 0) return;
        const ctx = canvasRef.current.getContext('2d');
        const avg7Map = new Map(calculateRollingAverages(data, 7).map(d => [d.date, d.avg]));

        if (chartRef.current) chartRef.current.destroy();

        chartRef.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: data.map(d => d.date.slice(5)),
            datasets: [
              {
                label: '7日真實趨勢',
                data: data.map(d => avg7Map.get(d.date)),
                borderColor: '#10b981',
                borderWidth: 2.5,
                tension: 0.2,
                pointRadius: 0
              },
              {
                label: '單日裸測點',
                data: data.map(d => d.weightKg),
                borderColor: 'rgba(113, 113, 122, 0.3)',
                backgroundColor: '#71717a',
                showLine: false,
                pointRadius: 3
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: { grid: { color: '#27272a' }, ticks: { color: '#a1a1aa', font: { size: 10 } } },
              y: { grid: { color: '#27272a' }, ticks: { color: '#a1a1aa', font: { size: 10 } } }
            },
            plugins: { legend: { labels: { color: '#d4d4d8', font: { size: 10 } } } }
          }
        });

        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [data]);

      return (
        <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 h-60 w-full">
          <canvas ref={canvasRef}></canvas>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('ANALYTICS');
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('eq_records_v4');
        return saved ? JSON.parse(saved) : [];
      });

      // 目標設定 (Calories, Protein, Carbs, Fat)
      const [targets, setTargets] = useState(() => {
        const saved = localStorage.getItem('eq_targets_v1');
        return saved ? JSON.parse(saved) : { calories: 2200, protein: 160, carbs: 220, fat: 60 };
      });

      const [showTargetModal, setShowTargetModal] = useState(false);

      const [dailyLog, setDailyLog] = useState({ weight: '', tags: [], foods: [], workouts: [] });

      // AI 食材分析 Input
      const [aiFoodInput, setAiFoodInput] = useState('');
      const [aiFoodLoading, setAiFoodLoading] = useState(false);

      // 訓練選單 State
      const [selectedCategory, setSelectedCategory] = useState(Object.keys(WORKOUT_EXERCISES)[0]);
      const [selectedExercise, setSelectedExercise] = useState(WORKOUT_EXERCISES[Object.keys(WORKOUT_EXERCISES)[0]][0]);
      const [exWeight, setExWeight] = useState('');
      const [exReps, setExReps] = useState('');
      const [exSets, setExSets] = useState('');

      const [apiKey, setApiKey] = useState(localStorage.getItem('eq_gemini_key') || '');

      useEffect(() => {
        localStorage.setItem('eq_records_v4', JSON.stringify(records));
      }, [records]);

      useEffect(() => {
        localStorage.setItem('eq_targets_v1', JSON.stringify(targets));
      }, [targets]);

      useEffect(() => {
        const existing = records.find(r => r.date === selectedDate);
        if (existing) {
          setDailyLog({
            weight: existing.weightKg || '',
            tags: existing.tags || [],
            foods: existing.foods || [],
            workouts: existing.workouts || []
          });
        } else {
          setDailyLog({ weight: '', tags: [], foods: [], workouts: [] });
        }
      }, [selectedDate, records]);

      const updateCurrentDateRecord = (fields) => {
        const updatedLog = { ...dailyLog, ...fields };
        setDailyLog(updatedLog);

        const totalCals = updatedLog.foods.reduce((s, f) => s + f.calories, 0);
        const totalProtein = updatedLog.foods.reduce((s, f) => s + f.protein, 0);
        const totalVol = updatedLog.workouts.reduce((s, w) => s + (w.weight * w.reps * w.sets), 0);

        setRecords(prev => {
          const idx = prev.findIndex(r => r.date === selectedDate);
          const newEntry = {
            date: selectedDate,
            weightKg: parseFloat(updatedLog.weight) || null,
            tags: updatedLog.tags,
            foods: updatedLog.foods,
            workouts: updatedLog.workouts,
            calories: totalCals,
            protein: totalProtein,
            volume: totalVol
          };

          if (idx >= 0) {
            const copy = [...prev];
            copy[idx] = { ...copy[idx], ...newEntry };
            return copy;
          } else {
            return [...prev, newEntry];
          }
        });
      };

      // 計算當日攝取總和
      const consumedTotals = useMemo(() => {
        return dailyLog.foods.reduce((acc, f) => ({
          calories: acc.calories + (f.calories || 0),
          protein: acc.protein + (f.protein || 0),
          carbs: acc.carbs + (f.carbs || 0),
          fat: acc.fat + (f.fat || 0)
        }), { calories: 0, protein: 0, carbs: 0, fat: 0 });
      }, [dailyLog.foods]);

      // AI 分析食物與卡路里
      const handleAnalyzeFoodAI = async () => {
        if (!aiFoodInput.trim()) return;
        setAiFoodLoading(true);

        const prompt = `
請分析以下食物描述並估算營養數據：
「${aiFoodInput}」

請直接輸出 JSON 格式 (不要包含 markdown 標籤或其餘文字)：
{
  "name": "簡短摘要內容描述",
  "calories": 數字(kcal),
  "protein": 數字(g),
  "carbs": 數字(g),
  "fat": 數字(g)
}
`;

        try {
          if (apiKey) {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            const clean = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(clean);

            const newFood = {
              id: 'f_' + Date.now(),
              name: parsed.name || aiFoodInput,
              calories: Math.round(parsed.calories || 0),
              protein: Number((parsed.protein || 0).toFixed(1)),
              carbs: Number((parsed.carbs || 0).toFixed(1)),
              fat: Number((parsed.fat || 0).toFixed(1))
            };
            updateCurrentDateRecord({ foods: [...dailyLog.foods, newFood] });
            setAiFoodInput('');
          } else {
            alert('請先在頂部輸入 Gemini API Key 以啟用 AI 食材分析功能。');
          }
        } catch (e) {
          alert('AI 解析失敗，請檢查 API Key 或輸入格式。');
        }
        setAiFoodLoading(false);
      };

      // 新增訓練組數
      const handleAddWorkout = () => {
        if (!exWeight || !exReps || !exSets) return;
        const newWorkout = {
          id: 'w_' + Date.now(),
          category: selectedCategory,
          name: selectedExercise,
          weight: parseFloat(exWeight),
          reps: parseInt(exReps),
          sets: parseInt(exSets)
        };
        updateCurrentDateRecord({ workouts: [...dailyLog.workouts, newWorkout] });
        setExWeight(''); setExReps(''); setExSets('');
      };

      return (
        <div className="max-w-md mx-auto px-4 pt-4 space-y-4">
          
          {/* Header */}
          <header className="flex items-center justify-between border-b border-zinc-800 pb-3">
            <div className="flex items-center gap-2">
              <div className="w-7 h-7 bg-emerald-500 text-zinc-950 font-black rounded-lg flex items-center justify-center text-xs">EQ</div>
              <h1 className="font-bold text-zinc-100 text-sm">Equilibrium 生理系統</h1>
            </div>
            <div className="flex items-center gap-2">
              <input
                type="password"
                placeholder="API Key"
                value={apiKey}
                onChange={(e) => {
                  setApiKey(e.target.value);
                  localStorage.setItem('eq_gemini_key', e.target.value);
                }}
                className="bg-zinc-900 border border-zinc-800 text-[10px] text-zinc-300 rounded px-1.5 py-1 w-20 font-mono"
              />
              <input
                type="date"
                value={selectedDate}
                onChange={(e) => setSelectedDate(e.target.value)}
                className="bg-zinc-900 border border-zinc-800 text-xs font-mono text-zinc-300 rounded-lg px-2 py-1"
              />
            </div>
          </header>

          {/* TAB 1: ANALYTICS */}
          {activeTab === 'ANALYTICS' && (
            <div className="space-y-4">
              <AnalyticsChart data={[...records].sort((a,b)=>new Date(a.date)-new Date(b.date))} />

              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 space-y-2">
                <div className="text-xs font-semibold text-zinc-200">當日裸測體重 ({selectedDate})</div>
                <input
                  type="number"
                  step="0.1"
                  placeholder="今日裸測體重 (kg)"
                  value={dailyLog.weight}
                  onChange={(e) => updateCurrentDateRecord({ weight: e.target.value })}
                  className="bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs w-full text-zinc-100 font-mono"
                />
                <div className="flex flex-wrap gap-1 pt-1">
                  {TAG_CATALOGUE.map(tag => {
                    const active = dailyLog.tags.includes(tag.id);
                    return (
                      <button
                        key={tag.id}
                        onClick={() => {
                          const newTags = active ? dailyLog.tags.filter(t => t !== tag.id) : [...dailyLog.tags, tag.id];
                          updateCurrentDateRecord({ tags: newTags });
                        }}
                        className={`text-[10px] px-2 py-1 rounded-lg border transition-all ${active ? tag.badge + ' font-bold' : 'bg-zinc-950 text-zinc-400 border-zinc-800'}`}
                      >
                        {tag.label}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: DIET & MACRO TARGETS */}
          {activeTab === 'DIET' && (
            <div className="space-y-3">
              
              {/* Target vs Consumed Remaining Card */}
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 space-y-3">
                <div className="flex justify-between items-center text-xs">
                  <span className="font-semibold text-zinc-200">每日營養目標與剩餘配額</span>
                  <button onClick={() => setShowTargetModal(true)} className="text-[10px] text-emerald-400 underline">
                    修改目標設定
                  </button>
                </div>

                <div className="grid grid-cols-4 gap-1 text-center font-mono text-xs">
                  <div className="bg-zinc-950 p-2 rounded-xl border border-zinc-800">
                    <div className="text-[10px] text-zinc-400">熱量剩餘</div>
                    <div className={`font-bold mt-1 ${targets.calories - consumedTotals.calories < 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                      {targets.calories - consumedTotals.calories} kcal
                    </div>
                    <div className="text-[9px] text-zinc-500 mt-0.5">/ {targets.calories}</div>
                  </div>

                  <div className="bg-zinc-950 p-2 rounded-xl border border-zinc-800">
                    <div className="text-[10px] text-zinc-400">蛋白剩餘</div>
                    <div className={`font-bold mt-1 ${targets.protein - consumedTotals.protein < 0 ? 'text-rose-400' : 'text-sky-400'}`}>
                      {Number((targets.protein - consumedTotals.protein).toFixed(1))}g
                    </div>
                    <div className="text-[9px] text-zinc-500 mt-0.5">/ {targets.protein}g</div>
                  </div>

                  <div className="bg-zinc-950 p-2 rounded-xl border border-zinc-800">
                    <div className="text-[10px] text-zinc-400">碳水剩餘</div>
                    <div className={`font-bold mt-1 ${targets.carbs - consumedTotals.carbs < 0 ? 'text-rose-400' : 'text-amber-400'}`}>
                      {Number((targets.carbs - consumedTotals.carbs).toFixed(1))}g
                    </div>
                    <div className="text-[9px] text-zinc-500 mt-0.5">/ {targets.carbs}g</div>
                  </div>

                  <div className="bg-zinc-950 p-2 rounded-xl border border-zinc-800">
                    <div className="text-[10px] text-zinc-400">脂肪剩餘</div>
                    <div className={`font-bold mt-1 ${targets.fat - consumedTotals.fat < 0 ? 'text-rose-400' : 'text-purple-400'}`}>
                      {Number((targets.fat - consumedTotals.fat).toFixed(1))}g
                    </div>
                    <div className="text-[9px] text-zinc-500 mt-0.5">/ {targets.fat}g</div>
                  </div>
                </div>
              </div>

              {/* AI Food Input */}
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 space-y-2">
                <div className="text-xs font-semibold text-zinc-200">AI 自然語言食材輸入</div>
                <div className="flex gap-2">
                  <input
                    type="text"
                    placeholder="例如：雞胸肉 200g，白飯 150g，全蛋 2隻"
                    value={aiFoodInput}
                    onChange={(e) => setAiFoodInput(e.target.value)}
                    className="bg-zinc-950 border border-zinc-800 text-xs text-zinc-200 rounded-xl px-3 py-2 w-full"
                  />
                  <button
                    onClick={handleAnalyzeFoodAI}
                    disabled={aiFoodLoading}
                    className="bg-emerald-500 text-zinc-950 font-bold px-3 text-xs rounded-xl whitespace-nowrap"
                  >
                    {aiFoodLoading ? '計算中...' : 'AI 分析'}
                  </button>
                </div>
              </div>

              {/* Today's Food List */}
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 space-y-2">
                <div className="text-xs font-semibold text-zinc-300">今日攝取清單</div>
                {dailyLog.foods.length === 0 ? (
                  <div className="text-xs text-zinc-500 py-2 text-center">尚無紀錄</div>
                ) : (
                  <div className="space-y-1.5">
                    {dailyLog.foods.map((f, i) => (
                      <div key={f.id || i} className="flex justify-between items-center bg-zinc-950 p-2 rounded-xl text-xs font-mono">
                        <div>
                          <div className="text-zinc-200 font-sans font-medium">{f.name}</div>
                          <div className="text-[10px] text-zinc-500">P:{f.protein}g | C:{f.carbs}g | F:{f.fat}g</div>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="text-emerald-400 font-bold">{f.calories} kcal</span>
                          <button onClick={() => updateCurrentDateRecord({ foods: dailyLog.foods.filter((_, idx) => idx !== i) })} className="text-rose-500 px-1">×</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TAB 3: WORKOUT (Menu-based) */}
          {activeTab === 'WORKOUT' && (
            <div className="space-y-3">
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 space-y-2">
                <div className="text-xs font-semibold text-zinc-200">選單式部位與動作紀錄</div>
                
                {/* 部位選單 */}
                <div className="space-y-1">
                  <label className="text-[10px] text-zinc-400">訓練部位</label>
                  <select
                    value={selectedCategory}
                    onChange={(e) => {
                      const cat = e.target.value;
                      setSelectedCategory(cat);
                      setSelectedExercise(WORKOUT_EXERCISES[cat][0]);
                    }}
                    className="bg-zinc-950 border border-zinc-800 text-xs text-zinc-200 rounded-xl p-2 w-full"
                  >
                    {Object.keys(WORKOUT_EXERCISES).map(cat => (
                      <option key={cat} value={cat}>{cat}</option>
                    ))}
                  </select>
                </div>

                {/* 動作選單 */}
                <div className="space-y-1">
                  <label className="text-[10px] text-zinc-400">動作項目</label>
                  <select
                    value={selectedExercise}
                    onChange={(e) => setSelectedExercise(e.target.value)}
                    className="bg-zinc-950 border border-zinc-800 text-xs text-zinc-200 rounded-xl p-2 w-full"
                  >
                    {WORKOUT_EXERCISES[selectedCategory].map(ex => (
                      <option key={ex} value={ex}>{ex}</option>
                    ))}
                  </select>
                </div>

                {/* 重量與組數 */}
                <div className="grid grid-cols-3 gap-1 font-mono pt-1">
                  <input type="number" placeholder="重量 (kg)" value={exWeight} onChange={e => setExWeight(e.target.value)} className="bg-zinc-950 border border-zinc-800 text-xs p-2 rounded-xl text-zinc-200" />
                  <input type="number" placeholder="次數 (Reps)" value={exReps} onChange={e => setExReps(e.target.value)} className="bg-zinc-950 border border-zinc-800 text-xs p-2 rounded-xl text-zinc-200" />
                  <input type="number" placeholder="組數 (Sets)" value={exSets} onChange={e => setExSets(e.target.value)} className="bg-zinc-950 border border-zinc-800 text-xs p-2 rounded-xl text-zinc-200" />
                </div>

                <button onClick={handleAddWorkout} className="w-full bg-amber-500 text-zinc-950 font-bold py-2 rounded-xl text-xs">
                  新增組數容量
                </button>
              </div>

              {/* Workout List */}
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 space-y-2">
                <div className="text-xs font-semibold text-zinc-300">今日訓練紀錄</div>
                {dailyLog.workouts.length === 0 ? (
                  <div className="text-xs text-zinc-500 py-2 text-center">尚無紀錄</div>
                ) : (
                  <div className="space-y-1.5">
                    {dailyLog.workouts.map((w, i) => (
                      <div key={w.id || i} className="flex justify-between items-center bg-zinc-950 p-2 rounded-xl text-xs font-mono">
                        <div>
                          <div className="text-zinc-200 font-sans font-medium">[{w.category?.split(' ')[0]}] {w.name}</div>
                          <div className="text-[10px] text-zinc-500">{w.weight} kg × {w.reps} 次 × {w.sets} 組</div>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="text-amber-400 font-bold">{w.weight * w.reps * w.sets} kg</span>
                          <button onClick={() => updateCurrentDateRecord({ workouts: dailyLog.workouts.filter((_, idx) => idx !== i) })} className="text-rose-500 px-1">×</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Modal for Targets Setting */}
          {showTargetModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 w-full max-w-xs space-y-3">
                <h3 className="font-bold text-sm text-zinc-100">設定每日營養目標</h3>
                <div className="space-y-2 text-xs font-mono">
                  <div>
                    <label className="text-[10px] text-zinc-400">總熱量 Target (kcal)</label>
                    <input type="number" value={targets.calories} onChange={e=>setTargets({...targets, calories: parseInt(e.target.value)||0})} className="bg-zinc-950 border border-zinc-800 rounded-xl p-2 w-full text-zinc-200 mt-0.5" />
                  </div>
                  <div>
                    <label className="text-[10px] text-zinc-400">蛋白質 Target (g)</label>
                    <input type="number" value={targets.protein} onChange={e=>setTargets({...targets, protein: parseInt(e.target.value)||0})} className="bg-zinc-950 border border-zinc-800 rounded-xl p-2 w-full text-zinc-200 mt-0.5" />
                  </div>
                  <div>
                    <label className="text-[10px] text-zinc-400">碳水化合物 Target (g)</label>
                    <input type="number" value={targets.carbs} onChange={e=>setTargets({...targets, carbs: parseInt(e.target.value)||0})} className="bg-zinc-950 border border-zinc-800 rounded-xl p-2 w-full text-zinc-200 mt-0.5" />
                  </div>
                  <div>
                    <label className="text-[10px] text-zinc-400">脂肪 Target (g)</label>
                    <input type="number" value={targets.fat} onChange={e=>setTargets({...targets, fat: parseInt(e.target.value)||0})} className="bg-zinc-950 border border-zinc-800 rounded-xl p-2 w-full text-zinc-200 mt-0.5" />
                  </div>
                </div>
                <button onClick={() => setShowTargetModal(false)} className="w-full bg-emerald-500 text-zinc-950 font-bold py-2 rounded-xl text-xs">
                  儲存目標
                </button>
              </div>
            </div>
          )}

          {/* Fixed Navigation */}
          <nav className="fixed bottom-0 left-0 right-0 bg-zinc-950/95 border-t border-zinc-800 backdrop-blur-md">
            <div className="max-w-md mx-auto flex justify-around py-2 text-[10px]">
              <button onClick={() => setActiveTab('ANALYTICS')} className={`flex flex-col items-center ${activeTab === 'ANALYTICS' ? 'text-emerald-400 font-bold' : 'text-zinc-500'}`}>📊 體重去噪</button>
              <button onClick={() => setActiveTab('DIET')} className={`flex flex-col items-center ${activeTab === 'DIET' ? 'text-emerald-400 font-bold' : 'text-zinc-500'}`}>🥗 飲食與目標</button>
              <button onClick={() => setActiveTab('WORKOUT')} className={`flex flex-col items-center ${activeTab === 'WORKOUT' ? 'text-emerald-400 font-bold' : 'text-zinc-500'}`}>🏋️ 訓練選單</button>
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
