<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Equilibrium 追蹤系統</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; cursor: pointer; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

const STORAGE_KEYS = {
  selectedDate: "equilibrium_selectedDate",
  weightHistory: "equilibrium_weightHistory",
  workouts: "equilibrium_workouts",
  nutrition: "equilibrium_nutrition",
};

const EXERCISE_PRESETS = [
  "槓鈴臥推", "上斜啞鈴推舉", "深蹲", "羅馬尼亞硬舉",
  "槓鈴划船", "滑輪下拉", "站姿肩推", "自訂項目...",
];

const FOOD_DB = [
  { name: "雞胸肉", kcal: 165, protein: 31, carb: 0, fat: 3.6 },
  { name: "白飯", kcal: 130, protein: 2.7, carb: 28, fat: 0.3 },
  { name: "雞蛋", kcal: 155, protein: 13, carb: 1.1, fat: 11 },
  { name: "牛肉", kcal: 250, protein: 26, carb: 0, fat: 15 },
  { name: "三文魚", kcal: 208, protein: 20, carb: 0, fat: 13 },
  { name: "燕麥", kcal: 389, protein: 16.9, carb: 66, fat: 6.9 },
  { name: "牛奶", kcal: 42, protein: 3.4, carb: 5, fat: 1 },
  { name: "蛋白粉", kcal: 400, protein: 80, carb: 10, fat: 5 },
  { name: "香蕉", kcal: 89, protein: 1.1, carb: 23, fat: 0.3 },
  { name: "豆腐", kcal: 76, protein: 8, carb: 1.9, fat: 4.8 },
  { name: "吞拿魚", kcal: 132, protein: 28, carb: 0, fat: 1 },
  { name: "芝士", kcal: 402, protein: 25, carb: 1.3, fat: 33 },
];

const DEFAULT_WEIGHT = 70.0;

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {}
}

function getWeightForDate(weightHistory, dateStr) {
  if (weightHistory[dateStr] !== undefined) return weightHistory[dateStr];
  const dates = Object.keys(weightHistory).filter((d) => d <= dateStr).sort();
  if (dates.length > 0) return weightHistory[dates[dates.length - 1]];
  return DEFAULT_WEIGHT;
}

function parseNutritionText(text) {
  const items = [];
  FOOD_DB.forEach((food) => {
    const escaped = food.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const regex = new RegExp(escaped + "\\s*[:：]?\\s*(\\d+(?:\\.\\d+)?)\\s*g", "g");
    let match;
    while ((match = regex.exec(text)) !== null) {
      const grams = parseFloat(match[1]);
      if (!grams || grams <= 0) continue;
      const ratio = grams / 100;
      items.push({
        name: food.name, grams,
        kcal: food.kcal * ratio, protein: food.protein * ratio,
        carb: food.carb * ratio, fat: food.fat * ratio,
      });
    }
  });
  const totals = items.reduce(
    (acc, it) => {
      acc.kcal += it.kcal; acc.protein += it.protein;
      acc.carb += it.carb; acc.fat += it.fat;
      return acc;
    },
    { kcal: 0, protein: 0, carb: 0, fat: 0 }
  );
  return { items, totals };
}

function round1(n) { return Math.round(n * 10) / 10; }

function Card({ title, children, right }) {
  return (
    <div className="bg-zinc-900/70 border border-zinc-800 rounded-2xl p-5 shadow-lg shadow-black/20">
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-sm font-semibold tracking-wide text-zinc-300 uppercase">{title}</h2>
        {right}
      </div>
      {children}
    </div>
  );
}

function WeightTracker({ weight, onAdjust }) {
  const buttons = [
    { label: "-0.5 kg", delta: -0.5 },
    { label: "-0.1 kg", delta: -0.1 },
    { label: "+0.1 kg", delta: 0.1 },
    { label: "+0.5 kg", delta: 0.5 },
  ];
  return (
    <Card title="體重紀錄">
      <div className="flex flex-col items-center py-2">
        <div className="text-5xl font-bold tabular-nums tracking-tight text-emerald-400">
          {weight.toFixed(1)}
          <span className="text-lg text-zinc-500 ml-1 font-medium">kg</span>
        </div>
        <div className="grid grid-cols-4 gap-2 mt-6 w-full">
          {buttons.map((b) => (
            <button key={b.label} onClick={() => onAdjust(b.delta)}
              className={"py-3 rounded-xl text-sm font-semibold transition active:scale-95 " +
                (b.delta > 0
                  ? "bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 border border-emerald-500/30"
                  : "bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 border border-rose-500/30")}>
              {b.label}
            </button>
          ))}
        </div>
      </div>
    </Card>
  );
}

function WorkoutLog({ workouts, onAdd, onDelete }) {
  const [exercise, setExercise] = useState(EXERCISE_PRESETS[0]);
  const [customName, setCustomName] = useState("");
  const [weightKg, setWeightKg] = useState("");
  const [reps, setReps] = useState("");
  const isCustom = exercise === "自訂項目...";

  const handleAdd = () => {
    const finalName = isCustom ? customName.trim() : exercise;
    if (!finalName) return;
    if (!weightKg || !reps) return;
    onAdd({ id: Date.now(), name: finalName, weight: parseFloat(weightKg), reps: parseInt(reps, 10) });
    setWeightKg(""); setReps("");
    if (isCustom) setCustomName("");
  };

  return (
    <Card title="訓練紀錄">
      <div className="space-y-3">
        <div>
          <label className="text-xs text-zinc-500 mb-1 block">動作項目</label>
          <select value={exercise} onChange={(e) => setExercise(e.target.value)}
            className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50">
            {EXERCISE_PRESETS.map((ex) => <option key={ex} value={ex}>{ex}</option>)}
          </select>
        </div>

        {isCustom && (
          <div>
            <label className="text-xs text-zinc-500 mb-1 block">自訂動作名稱</label>
            <input type="text" value={customName} onChange={(e) => setCustomName(e.target.value)}
              placeholder="請輸入動作名稱"
              className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50" />
          </div>
        )}

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-xs text-zinc-500 mb-1 block">重量 (kg)</label>
            <input type="number" step="0.5" value={weightKg} onChange={(e) => setWeightKg(e.target.value)}
              placeholder="0"
              className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50" />
          </div>
          <div>
            <label className="text-xs text-zinc-500 mb-1 block">次數</label>
            <input type="number" value={reps} onChange={(e) => setReps(e.target.value)}
              placeholder="0"
              className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50" />
          </div>
        </div>

        <button onClick={handleAdd}
          className="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-semibold text-sm transition active:scale-95">
          新增紀錄
        </button>

        <div className="pt-2">
          {workouts.length === 0 ? (
            <p className="text-xs text-zinc-600 text-center py-4">今天還沒有訓練紀錄</p>
          ) : (
            <ul className="space-y-2 max-h-60 overflow-y-auto pr-1">
              {workouts.map((w) => (
                <li key={w.id} className="flex items-center justify-between bg-zinc-800/60 rounded-xl px-3 py-2.5 border border-zinc-800">
                  <div>
                    <p className="text-sm font-medium text-zinc-200">{w.name}</p>
                    <p className="text-xs text-zinc-500 mt-0.5">{w.weight} kg × {w.reps} 次</p>
                  </div>
                  <button onClick={() => onDelete(w.id)}
                    className="text-zinc-600 hover:text-rose-400 text-xs px-2 py-1 transition">刪除</button>
                </li>
              ))}
            </ul>
          )}
        </div>
      </div>
    </Card>
  );
}

function NutritionAnalyzer({ entries, onAdd, onDelete }) {
  const [text, setText] = useState("");
  const [preview, setPreview] = useState(null);

  const handlePreview = () => {
    if (!text.trim()) { setPreview(null); return; }
    setPreview(parseNutritionText(text));
  };

  const handleAddEntry = () => {
    const result = preview || parseNutritionText(text);
    if (!result || result.items.length === 0) return;
    onAdd({ id: Date.now(), text: text.trim(), items: result.items, totals: result.totals });
    setText(""); setPreview(null);
  };

  const dayTotals = useMemo(() => entries.reduce(
    (acc, e) => {
      acc.kcal += e.totals.kcal; acc.protein += e.totals.protein;
      acc.carb += e.totals.carb; acc.fat += e.totals.fat;
      return acc;
    },
    { kcal: 0, protein: 0, carb: 0, fat: 0 }
  ), [entries]);

  const foodNameList = FOOD_DB.map((f) => f.name).join("、");

  return (
    <Card title="飲食與營養分析（離線解析）">
      <div className="space-y-3">
        <div>
          <label className="text-xs text-zinc-500 mb-1 block">輸入飲食內容（例如：雞胸肉 200g，白飯 150g）</label>
          <textarea value={text} onChange={(e) => { setText(e.target.value); setPreview(null); }} rows={3}
            placeholder="雞胸肉 200g，白飯 150g&#10;可用逗號、頓號或換行分隔多項食物"
            className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50 resize-none" />
          <p className="text-xs text-zinc-600 mt-1">資料庫收錄食物：{foodNameList}</p>
        </div>

        <div className="flex gap-2">
          <button onClick={handlePreview}
            className="flex-1 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-semibold text-sm transition active:scale-95 border border-zinc-700">解析預覽</button>
          <button onClick={handleAddEntry}
            className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-semibold text-sm transition active:scale-95">加入今日紀錄</button>
        </div>

        {preview && (
          <div className="bg-zinc-800/50 rounded-xl p-3 border border-zinc-800">
            {preview.items.length === 0 ? (
              <p className="text-xs text-rose-400">無法辨識任何食物，請確認格式（例如「雞胸肉 200g」）</p>
            ) : (
              <div className="space-y-1">
                {preview.items.map((it, idx) => (
                  <p key={idx} className="text-xs text-zinc-400">{it.name} {it.grams}g → {round1(it.kcal)} kcal</p>
                ))}
                <p className="text-xs text-emerald-400 pt-1 border-t border-zinc-700 mt-2">
                  小計：{round1(preview.totals.kcal)} kcal ・ 蛋白 {round1(preview.totals.protein)}g ・
                  碳水 {round1(preview.totals.carb)}g ・ 脂肪 {round1(preview.totals.fat)}g
                </p>
              </div>
            )}
          </div>
        )}

        <div className="grid grid-cols-4 gap-2 pt-2">
          <div className="bg-zinc-800/60 rounded-xl px-2 py-3 text-center border border-zinc-800">
            <p className="text-xs text-zinc-500">卡路里</p>
            <p className="text-base font-bold text-zinc-100 mt-1">{round1(dayTotals.kcal)}</p>
            <p className="text-[10px] text-zinc-600">kcal</p>
          </div>
          <div className="bg-zinc-800/60 rounded-xl px-2 py-3 text-center border border-zinc-800">
            <p className="text-xs text-zinc-500">蛋白質</p>
            <p className="text-base font-bold text-emerald-400 mt-1">{round1(dayTotals.protein)}</p>
            <p className="text-[10px] text-zinc-600">g</p>
          </div>
          <div className="bg-zinc-800/60 rounded-xl px-2 py-3 text-center border border-zinc-800">
            <p className="text-xs text-zinc-500">碳水化合物</p>
            <p className="text-base font-bold text-amber-400 mt-1">{round1(dayTotals.carb)}</p>
            <p className="text-[10px] text-zinc-600">g</p>
          </div>
          <div className="bg-zinc-800/60 rounded-xl px-2 py-3 text-center border border-zinc-800">
            <p className="text-xs text-zinc-500">脂肪</p>
            <p className="text-base font-bold text-rose-400 mt-1">{round1(dayTotals.fat)}</p>
            <p className="text-[10px] text-zinc-600">g</p>
          </div>
        </div>

        <div className="pt-1">
          {entries.length === 0 ? (
            <p className="text-xs text-zinc-600 text-center py-3">今天還沒有飲食紀錄</p>
          ) : (
            <ul className="space-y-2 max-h-48 overflow-y-auto pr-1">
              {entries.map((e) => (
                <li key={e.id} className="flex items-center justify-between bg-zinc-800/40 rounded-xl px-3 py-2 border border-zinc-800">
                  <div className="min-w-0">
                    <p className="text-xs text-zinc-300 truncate">{e.text}</p>
                    <p className="text-[11px] text-zinc-500 mt-0.5">{round1(e.totals.kcal)} kcal</p>
                  </div>
                  <button onClick={() => onDelete(e.id)}
                    className="text-zinc-600 hover:text-rose-400 text-xs px-2 py-1 transition shrink-0">刪除</button>
                </li>
              ))}
            </ul>
          )}
        </div>
      </div>
    </Card>
  );
}

function App() {
  const [selectedDate, setSelectedDate] = useState(() => loadJSON(STORAGE_KEYS.selectedDate, null) || todayStr());
  const [weightHistory, setWeightHistory] = useState(() => loadJSON(STORAGE_KEYS.weightHistory, {}));
  const [workoutsByDate, setWorkoutsByDate] = useState(() => loadJSON(STORAGE_KEYS.workouts, {}));
  const [nutritionByDate, setNutritionByDate] = useState(() => loadJSON(STORAGE_KEYS.nutrition, {}));

  useEffect(() => saveJSON(STORAGE_KEYS.selectedDate, selectedDate), [selectedDate]);
  useEffect(() => saveJSON(STORAGE_KEYS.weightHistory, weightHistory), [weightHistory]);
  useEffect(() => saveJSON(STORAGE_KEYS.workouts, workoutsByDate), [workoutsByDate]);
  useEffect(() => saveJSON(STORAGE_KEYS.nutrition, nutritionByDate), [nutritionByDate]);

  const currentWeight = getWeightForDate(weightHistory, selectedDate);
  const currentWorkouts = workoutsByDate[selectedDate] || [];
  const currentNutrition = nutritionByDate[selectedDate] || [];

  const handleAdjustWeight = useCallback((delta) => {
    setWeightHistory((prev) => {
      const base = getWeightForDate(prev, selectedDate);
      const next = Math.max(0, round1(base + delta));
      return { ...prev, [selectedDate]: next };
    });
  }, [selectedDate]);

  const handleAddWorkout = useCallback((entry) => {
    setWorkoutsByDate((prev) => {
      const list = prev[selectedDate] || [];
      return { ...prev, [selectedDate]: [...list, entry] };
    });
  }, [selectedDate]);

  const handleDeleteWorkout = useCallback((id) => {
    setWorkoutsByDate((prev) => {
      const list = prev[selectedDate] || [];
      return { ...prev, [selectedDate]: list.filter((w) => w.id !== id) };
    });
  }, [selectedDate]);

  const handleAddNutrition = useCallback((entry) => {
    setNutritionByDate((prev) => {
      const list = prev[selectedDate] || [];
      return { ...prev, [selectedDate]: [...list, entry] };
    });
  }, [selectedDate]);

  const handleDeleteNutrition = useCallback((id) => {
    setNutritionByDate((prev) => {
      const list = prev[selectedDate] || [];
      return { ...prev, [selectedDate]: list.filter((n) => n.id !== id) };
    });
  }, [selectedDate]);

  const handleToday = () => setSelectedDate(todayStr());

  return (
    <div className="max-w-2xl mx-auto px-4 py-6 pb-16">
      <header className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-xl font-bold tracking-tight">
            Equilibrium <span className="text-emerald-400">追蹤系統</span>
          </h1>
          <p className="text-xs text-zinc-500 mt-0.5">體態與訓練紀錄</p>
        </div>
        <div className="flex items-center gap-2">
          <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)}
            className="bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/50" />
          <button onClick={handleToday}
            className="text-xs px-3 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-300 transition">今天</button>
        </div>
      </header>

      <div className="space-y-5">
        <WeightTracker weight={currentWeight} onAdjust={handleAdjustWeight} />
        <WorkoutLog workouts={currentWorkouts} onAdd={handleAddWorkout} onDelete={handleDeleteWorkout} />
        <NutritionAnalyzer entries={currentNutrition} onAdd={handleAddNutrition} onDelete={handleDeleteNutrition} />
      </div>

      <footer className="text-center text-[11px] text-zinc-700 mt-8">所有資料僅儲存於本機瀏覽器（LocalStorage）</footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
